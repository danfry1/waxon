version: 2

project_name: waxon

before:
  hooks:
    - go mod tidy
    - go test -race ./...

builds:
  - main: .
    binary: waxon
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

# Linux packages, attached to the GitHub Release.
nfpms:
  - package_name: waxon
    vendor: Daniel Fry
    homepage: https://github.com/danfry1/waxon
    maintainer: Daniel Fry <danielfentonfry@gmail.com>
    description: A vim-modal Spotify client for the terminal
    license: GPL-3.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

# Homebrew: a formula in danfry1/homebrew-tap that builds waxon from the tagged
# source (no unsigned binary, nothing to un-quarantine). The release workflow's
# homebrew-formula job bumps it; GoReleaser does not manage it.

# Windows: Scoop manifest in danfry1/scoop-bucket. The token is minted per run
# from a GitHub App by the release workflow.
scoops:
  - repository:
      owner: danfry1
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/danfry1/waxon
    description: A vim-modal Spotify client for the terminal
    license: GPL-3.0

checksum:
  name_template: "checksums.txt"

# Release notes come from CHANGELOG.md: the workflow passes the tag's section
# via --release-notes, which replaces goreleaser's generated changelog. (Do not
# set changelog.disable — that empties the release body even when notes are
# supplied.)
changelog:
  sort: asc
